[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-core"
version = "0.1.0"
description = "Shared LLM client, mock, security, audit and eval utilities"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
