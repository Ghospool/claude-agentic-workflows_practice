[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-processing-pipeline"
version = "0.1.0"
description = "Parallel batch pipeline: structured extraction at scale with resilience and checkpointing"
requires-python = ">=3.10"
dependencies = ["agentic-core"]

[project.scripts]
data-pipeline = "data_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_pipeline = ["prompts/*.md"]
